services:
  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      [
        "/opt/kafka/bin/kafka-topics.sh",
        "--bootstrap-server",
        "kafka:29092",
        "--create",
        "--if-not-exists",
        "--topic",
        "user.registered.v1",
        "--partitions",
        "1",
        "--replication-factor",
        "1",
      ]
    restart: "no"

  auth-service:
    build:
      context: ./auth-service
      target: development
    env_file:
      - ./auth-service/.env
    environment:
      PORT: 3001
      DB_HOST: host.docker.internal
      KAFKA_BROKERS: kafka:29092
      NODE_ENV: development
      TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingFsWatchFile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./auth-service:/app
      - auth_node_modules:/app/node_modules
      - ./auth-service/logs:/app/logs
    ports:
      - "3001:3001"
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      target: development
    env_file:
      - ./user-service/.env
    environment:
      PORT: 3002
      DB_HOST: host.docker.internal
      KAFKA_BROKERS: kafka:29092
      NODE_ENV: development
      TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingFsWatchFile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./user-service:/app
      - user_node_modules:/app/node_modules
      - ./user-service/logs:/app/logs
    ports:
      - "3002:3002"
    restart: unless-stopped

  product-service:
    build:
      context: ./product-service
      target: development
    env_file:
      - path: ./product-service/.env
        required: false
    environment:
      PORT: 3003
      DB_HOST: host.docker.internal
      NODE_ENV: development
      PRODUCT_CATALOG_FILE: /catalog/product.json
      TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingFsWatchFile
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./product-service:/app
      - product_node_modules:/app/node_modules
      - ./product.json:/catalog/product.json:ro
    ports:
      - "3003:3003"
    restart: unless-stopped

volumes:
  kafka_data:
  auth_node_modules:
  user_node_modules:
  product_node_modules:
